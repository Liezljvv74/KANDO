services:
  db:
    image: postgis/postgis:17-3.5
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: kando
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d kando']
      interval: 2s
      timeout: 3s
      retries: 30
