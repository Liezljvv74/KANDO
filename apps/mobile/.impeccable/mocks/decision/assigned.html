<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#FFC83D;font-family:'Arial Black',Arial,sans-serif;color:#12356B;overflow:hidden;position:relative}
.plate{background:#FBFBF6;border:5px solid #12356B;border-radius:14px;position:relative;box-shadow:0 4px 0 #0d2a55}
.plate:before,.plate:after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:#12356B}.plate:before{left:9px}.plate:after{right:9px}
.brand{position:absolute;left:24px;top:56px;padding:8px 20px;font-size:20px;letter-spacing:3px}
.lang{position:absolute;right:24px;top:62px;font:700 15px Arial;border:3px solid #12356B;border-radius:20px;padding:5px 12px}
h1{position:absolute;left:24px;top:132px;width:340px;font-size:42px;line-height:1.02;letter-spacing:-1px}
.panel{position:absolute;left:24px;right:24px;top:318px;height:236px;background:#12356B;border-radius:22px;padding:18px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.name{background:#FBFBF6;border-radius:8px;height:38px;color:#12356B;font:700 15px Arial;padding:10px 12px;position:relative}
.name i{position:absolute;right:10px;top:13px;width:11px;height:11px;border-radius:50%;background:#FFC83D;box-shadow:0 0 8px #FFC83D}
.bell{position:absolute;left:50%;bottom:-34px;margin-left:-62px;width:124px;height:124px;border-radius:50%;background:#E8503A;border:8px solid #FBFBF6;box-shadow:0 6px 0 #a93221;color:#fff;font:800 17px Arial;text-align:center;padding-top:42px}
.cats{position:absolute;left:24px;right:24px;top:650px;display:flex;gap:10px}.cats .plate{flex:1;height:64px;font-size:15px;text-align:center;padding-top:22px}
.nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#12356B}
</style></head><body>
<div class="plate brand">KANDO</div><div class="lang">DE</div>
<h1>Nebenan wohnt jemand, der dir hilft.</h1>
<div class="panel"><div class="names"><div class="name">Putzen · Anna K.<i></i></div><div class="name">Garten · Mehmet<i></i></div><div class="name">Hundeausf. · Lea<i></i></div><div class="name">Fenster · Team Ost<i></i></div></div><div class="bell">Hilfe finden</div></div>
<div class="cats"><div class="plate">Putzen</div><div class="plate">Garten</div><div class="plate">Hund</div></div>
<div class="nav"></div></body></html>
