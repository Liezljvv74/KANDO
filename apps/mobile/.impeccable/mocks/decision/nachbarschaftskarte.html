<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#BDE3C4;font-family:Arial,sans-serif;color:#1B2A57;overflow:hidden;position:relative}
.st{position:absolute;background:#FFF4D6;border-radius:20px}
.h{position:absolute;width:44px;height:36px;background:#fff;border-bottom:8px solid #2B6CB0;border-radius:6px}
.pin{position:absolute;width:52px;height:52px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#E8452C;border:4px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.top{position:absolute;left:20px;right:20px;top:54px;background:#fff;border-radius:26px;padding:16px 20px;font:700 17px Arial;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:300px;background:#fff;border-radius:28px 28px 0 0;padding:22px;box-shadow:0 -6px 16px rgba(0,0,0,.12)}
.sheet h2{font:800 22px Georgia}.row{margin-top:14px;padding:14px;background:#FFF4D6;border-radius:14px;font:700 16px Arial;display:flex;justify-content:space-between}
.row i{font-style:normal;color:#E8452C}
</style></head><body>
<div class="st" style="left:-20px;top:240px;width:440px;height:46px;transform:rotate(-8deg)"></div><div class="st" style="left:150px;top:100px;width:46px;height:440px;transform:rotate(12deg)"></div>
<div class="h" style="left:40px;top:180px"></div><div class="h" style="left:260px;top:300px"></div><div class="h" style="left:80px;top:370px"></div>
<div class="pin" style="left:90px;top:250px"></div><div class="pin" style="left:230px;top:200px;background:#2B6CB0"></div><div class="pin" style="left:290px;top:380px;background:#FFC93C"></div>
<div class="top">Wer ist heute in deiner Nähe?</div>
<div class="sheet"><h2>3 Helfer in 500 m</h2><div class="row">Anna · Putzen<i>24 €/Std.</i></div><div class="row">Mehmet · Garten<i>28 €/Std.</i></div></div>
</body></html>
