<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#E9DFC9;font-family:Georgia,serif;color:#1F3552;overflow:hidden;position:relative}
.card{position:absolute;left:20px;right:20px;top:70px;height:560px;background:#FBF3E4;border-radius:6px;box-shadow:0 10px 24px rgba(60,40,10,.2);transform:rotate(-1deg);padding:24px}
.stamp{position:absolute;right:22px;top:22px;width:92px;height:110px;background:#F26B4F;border:6px solid #FBF3E4;outline:2px dashed #2F6FB5;outline-offset:-1px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 13px Arial}
.pm{position:absolute;right:104px;top:48px;width:84px;height:84px;border:3px solid #2F6FB5;border-radius:50%;opacity:.5;font:700 11px Arial;text-align:center;padding-top:30px;color:#2F6FB5}
h1{width:220px;font-size:32px;line-height:1.08;margin-top:150px;font-style:italic}
p{margin-top:20px;font-size:19px;line-height:1.4;width:300px}
.sign{margin-top:18px;font:italic 22px Georgia;color:#2F6FB5}
.cta{position:absolute;left:24px;right:24px;bottom:96px;height:58px;border-radius:29px;background:#F26B4F;color:#fff;font:700 19px Arial;text-align:center;padding-top:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#FBF3E4}
</style></head><body>
<div class="card"><div class="stamp">Anna K.</div><div class="pm">BERLIN<br>04.11.</div>
<h1>Liebe Nachbarin, ich putze gern für dich.</h1>
<p>Zwei Straßen weiter, geprüft und heute noch frei. Schreib mir einfach zurück.</p><div class="sign">Anna</div></div>
<div class="cta">Zurückschreiben</div><div class="nav"></div></body></html>
