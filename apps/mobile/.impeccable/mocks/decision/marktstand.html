<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:#FBF6EA;font-family:Georgia,serif;color:#26332D;overflow:hidden;position:relative}
.awn{position:absolute;left:0;right:0;top:0;height:120px;background:repeating-linear-gradient(90deg,#D8452F 0 39px,#FBF6EA 39px 78px);border-radius:0 0 40px 40px/0 0 24px 24px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.board{position:absolute;left:24px;right:24px;top:150px;height:150px;background:#26332D;border:8px solid #C98B4E;border-radius:6px;color:#fff;font:700 30px 'Comic Sans MS',Georgia;padding:22px;line-height:1.15}
.board small{display:block;font:15px Arial;color:#F2B63C;margin-top:10px}
.crates{position:absolute;left:24px;right:24px;top:336px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.crate{height:120px;background:#E6C58F;border:3px solid #9a6a33;border-radius:6px;padding:16px;font:700 20px Arial;position:relative}
.crate:after{content:"";position:absolute;left:0;right:0;top:46px;height:3px;background:#9a6a33}
.crate b{display:block;font:13px Arial;margin-top:44px}
.cta{position:absolute;left:24px;right:24px;bottom:96px;height:58px;border-radius:8px;background:#D8452F;color:#fff;font:800 19px Arial;text-align:center;padding-top:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#26332D}
</style></head><body><div class="awn"></div>
<div class="board">Heute auf dem Markt<small>12 Helfer in deiner Nähe</small></div>
<div class="crates"><div class="crate">Putzen<b>5 frei</b></div><div class="crate">Garten<b>3 frei</b></div><div class="crate">Hund<b>2 frei</b></div><div class="crate">Umzug<b>2 frei</b></div></div>
<div class="cta">Hilfe finden</div><div class="nav"></div></body></html>
