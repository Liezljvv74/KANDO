<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;background:linear-gradient(#CFE8F7,#EEF7FB 60%,#F7F3E6);font-family:Georgia,serif;color:#25402F;overflow:hidden;position:relative}
.sun{position:absolute;right:-60px;top:-60px;width:210px;height:210px;border-radius:50%;background:#FFD35C}
h1{position:absolute;left:24px;top:84px;width:300px;font-size:38px;line-height:1.05}
.line{position:absolute;left:-10px;width:420px;height:2px;background:#8a7a64;top:300px;transform:rotate(3deg);transform-origin:left}
.card{position:absolute;width:150px;height:190px;background:#fff;border-radius:6px;box-shadow:0 6px 14px rgba(40,60,70,.18);padding:34px 12px 12px;font:700 16px Arial}
.card small{display:block;font:13px Arial;color:#5b6b60;margin-top:4px}
.peg{position:absolute;left:62px;top:-12px;width:22px;height:46px;background:#C98B4E;border-radius:4px}
.dot{display:block;width:70px;height:70px;border-radius:50%;margin:10px 0 8px}
.flag{position:absolute;right:-6px;top:50px;background:#FFD35C;font:700 11px Arial;padding:3px 7px;border-radius:3px}
.cta{position:absolute;left:24px;right:24px;bottom:96px;height:58px;border-radius:29px;background:#2F7D4F;color:#fff;font:700 19px Arial;text-align:center;padding-top:18px}
.nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff}
</style></head><body><div class="sun"></div>
<h1>Gute Hilfe hängt gleich nebenan.</h1>
<div class="line"></div>
<div class="card" style="left:20px;top:300px;transform:rotate(-2deg)"><div class="peg"></div><span class="dot" style="background:#9CD3B0"></span>Anna K.<small>Putzen · 24 €/Std.</small><span class="flag">heute frei</span></div>
<div class="card" style="left:210px;top:334px;transform:rotate(2deg)"><div class="peg"></div><span class="dot" style="background:#F6C9A0"></span>Mehmet<small>Garten · 28 €/Std.</small></div>
<div class="cta">Hilfe finden</div><div class="nav"></div></body></html>
